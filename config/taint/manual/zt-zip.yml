# B2 manual taint specification for zt-zip (CVE-2018-1002201).
# Added on top of the B1 base configuration (Tai-e commonly-used config for CWE-022).
#
# Prepared from work/manual-candidates/zt-zip.md (the API list shown to N2)
# and the buggy-version source. Advisories, fix diffs and fix_info.csv were not
# consulted during preparation. Each entry records its technical rationale.
# Preparation details and limitations: report/main_revised2.tex.
#
# Format: "<pkg.Cls: retType name(argType1,argType2)>"; index = result | base | 0,1,... | "N[*]" (array elements).

# Specification rationale for path traversal in a ZIP library:
# * The attacker controls the ARCHIVE, so entry names read from it are untrusted. The destination
#   directory and the archive file are chosen by the calling application (trusted API arguments).
# * The commonly-used config marks File(File,String) only on argument 0 (the parent); the child name
#   (argument 1) is where an entry name like "../../x" ends up.
# * Files opened for writing are the real impact, so the File object must carry taint to them.
sources:
  # entry name stored in the archive
  - { kind: call, method: "<java.util.zip.ZipEntry: java.lang.String getName()>", index: result }

sinks:
  # child path component of a new File
  - { method: "<java.io.File: void <init>(java.io.File,java.lang.String)>", index: 1 }
  # files created/overwritten from a (possibly) tainted File object
  - { method: "<java.io.FileOutputStream: void <init>(java.io.File)>", index: 0 }
  - { method: "<java.io.FileOutputStream: void <init>(java.io.File,boolean)>", index: 0 }

transfers:
  # a File built from a tainted child name is tainted (parent = trusted destination, not propagated)
  - { method: "<java.io.File: void <init>(java.io.File,java.lang.String)>", from: 1, to: base }
  - { method: "<java.io.File: void <init>(java.lang.String)>", from: 0, to: base }
  # path views of a tainted File
  - { method: "<java.io.File: java.io.File getParentFile()>", from: base, to: result }
  - { method: "<java.io.File: java.lang.String getPath()>", from: base, to: result }
  - { method: "<java.io.File: java.lang.String getAbsolutePath()>", from: base, to: result }
  - { method: "<java.io.File: java.io.File getAbsoluteFile()>", from: base, to: result }
  # entry names copied into new ZipEntry objects (name mappers / repacking)
  - { method: "<java.util.zip.ZipEntry: void <init>(java.lang.String)>", from: 0, to: base }

# No library sanitizer: canonical-path checks are app code and their correctness is what is in
# question, so they are not declared as sanitizers.
sanitizers: []
