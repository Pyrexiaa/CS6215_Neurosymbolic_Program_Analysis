    all_fix_commits: [227628567354d3c156951009d683c6fec3006e0e]
    jdk: 8
    maven: "3.5.0"
    why: "Spring Boot web app; stored XSS (hard case, both CodeQL and IRIS missed it)."
    # xxl-job is a multi-module Maven project; only the admin web app is analysed.
    modules: [xxl-job-admin]
    # Tai-e's Spring plugin (DI + web entry points) can replace the driver for this subject.
    # Try it as an extra baseline: taie: {extra_pta_options: {spring: "true"}}

